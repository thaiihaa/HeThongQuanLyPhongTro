server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: quan-ly-phong-tro-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-test-query: SELECT 1
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: ${ROOM_MEDIA_MAX_REQUEST_SIZE:1024MB}
      max-request-size: ${ROOM_MEDIA_MAX_REQUEST_SIZE:1024MB}

app:
  media:
    storage-dir: ${ROOM_MEDIA_STORAGE_DIR:uploads}
    max-image-size-bytes: ${ROOM_MEDIA_MAX_IMAGE_SIZE_BYTES:20971520}
    max-video-size-bytes: ${ROOM_MEDIA_MAX_VIDEO_SIZE_BYTES:524288000}
    max-request-size-bytes: ${ROOM_MEDIA_MAX_REQUEST_SIZE_BYTES:1073741824}
    max-files-per-upload: ${ROOM_MEDIA_MAX_FILES_PER_UPLOAD:10}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    session:
      expiration-seconds: ${SESSION_EXPIRATION_SECONDS:43200}
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      phone: ${BOOTSTRAP_ADMIN_PHONE:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:}
    tenant:
      enabled: ${BOOTSTRAP_TENANT_ENABLED:false}
      username: ${BOOTSTRAP_TENANT_USERNAME:}
      email: ${BOOTSTRAP_TENANT_EMAIL:}
      phone: ${BOOTSTRAP_TENANT_PHONE:}
      password: ${BOOTSTRAP_TENANT_PASSWORD:}
      full-name: ${BOOTSTRAP_TENANT_FULL_NAME:}
    demo-users:
      enabled: ${APP_BOOTSTRAP_DEMO_USERS:false}
      admin-password: ${APP_BOOTSTRAP_DEMO_ADMIN_PASSWORD:}
      tenant-password: ${APP_BOOTSTRAP_DEMO_TENANT_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.quanlyphongtro: INFO
    com.zaxxer.hikari: INFO
    org.hibernate.SQL: WARN
    org.springframework.jdbc: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
